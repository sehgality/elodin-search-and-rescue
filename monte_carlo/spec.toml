# n_samples=12 dispersion draws (heat-source placement) x 8 fault
# conditions (7 real faults + 1 "none" control/baseline) = 96 runs.
# "Small, solid proof-of-concept" scope on purpose.
[monte_carlo]
n_samples = 12
seed = 42
method = "lhs"

[monte_carlo.variables]
heat_angle_rad = { dist = "uniform", min = 0.0, max = 6.283185307 }
heat_radius_frac = { dist = "uniform", min = 0.0, max = 1.0 }

# Cross-producted against every mc row and every sim-sweep row (none here)
# -- see libs/nox-py/python/elodin/monte_carlo/sample.py's materialize().
# Each value becomes its own full dispersion sweep (12 runs).
[meta_sweep]
fault = [
    "none",
    "hover_entry_no_speed_check",
    "tick_timing_unscaled",
    "hold_point_freeze",
    "tilt_cap_relaxed",
    "thermal_threshold_drift",
    "camera_fov_mismatch",
    "imu_noise_spike",
]
